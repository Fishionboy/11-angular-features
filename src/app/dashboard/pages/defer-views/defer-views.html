<p>defer-views works!</p>

<section class="grid grid-cols-1">

    @defer () {
        
    <heavy-loaders-slow cssClass="bg-blue-500"></heavy-loaders-slow>
    } @placeholder {
    <p
        class="h-150 w-full bg-linear-to-r from-gray-200 to-gray-400 animate-pulse">
        Cargando...
    </p>
    <img src="" alt="">
    }
    
    @defer (on idle) {
    <heavy-loaders-slow cssClass="bg-green-500"></heavy-loaders-slow>
    } @placeholder {
    <p
        class="h-150 w-full bg-linear-to-r from-gray-200 to-gray-400 animate-pulse">
        Cargando...
    </p>
    }
    
    @defer (on viewport) {
    <heavy-loaders-slow cssClass="bg-purple-500"></heavy-loaders-slow>
    } @placeholder {
    <p
        class="h-150 w-full bg-linear-to-r from-gray-200 to-gray-400 animate-pulse">
        Cargando...
    </p>
    }

</section>
